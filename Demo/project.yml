name: RollingNumberLabelDemo
options:
  bundleIdPrefix: com.rollingnumberlabel
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "16.0"

packages:
  RollingNumberLabel:
    path: ../

targets:
  RollingNumberLabelDemo:
    type: application
    platform: iOS
    sources:
      - RollingNumberLabelDemo/Sources
    dependencies:
      - package: RollingNumberLabel
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rollingnumberlabel.demo
        PRODUCT_NAME: "$(TARGET_NAME)"
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  RollingNumberLabelDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - RollingNumberLabelDemoUITests
    dependencies:
      - target: RollingNumberLabelDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rollingnumberlabel.demo.uitests
        PRODUCT_NAME: "$(TARGET_NAME)"
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: RollingNumberLabelDemo

schemes:
  RollingNumberLabelDemo:
    build:
      targets:
        RollingNumberLabelDemo: all
        RollingNumberLabelDemoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RollingNumberLabelDemoUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
